name: Armhf Release

on:
  workflow_dispatch:
    inputs:
      tag:
        description: "Release tag, for example v0.1.0-armhf"
        required: true
        type: string
      release_name:
        description: "Release title"
        required: false
        default: ""
        type: string
      prerelease:
        description: "Mark release as prerelease"
        required: false
        default: false
        type: boolean

permissions:
  contents: write

jobs:
  build-armhf:
    runs-on: ubuntu-22.04

    env:
      ARCHIVE_NAME: ZcAILib-${{ inputs.tag }}-linux-armhf.tar.gz
      BUILD_TYPE: Release
      PACKAGE_DIR: package/ZcAILib

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Build armhf package
        uses: uraimo/run-on-arch-action@v2
        with:
          arch: armv7
          distro: bookworm
          githubToken: ${{ github.token }}
          install: |
            apt-get update
            DEBIAN_FRONTEND=noninteractive apt-get install -y \
              build-essential \
              ca-certificates \
              cmake \
              file \
              ninja-build \
              qt6-base-dev
          run: |
            set -euxo pipefail
            ARCHIVE_NAME="${{ env.ARCHIVE_NAME }}"
            BUILD_TYPE="${{ env.BUILD_TYPE }}"
            PACKAGE_DIR="${{ env.PACKAGE_DIR }}"

            uname -m
            rm -rf build-armhf package package-install
            cmake -S . -B build-armhf -G Ninja \
              -DCMAKE_BUILD_TYPE="${BUILD_TYPE}" \
              -DCMAKE_INSTALL_PREFIX="${PWD}/package-install/ZcAILib"
            cmake --build build-armhf --target ZcAiLib ZcAiLibStatic
            cmake --install build-armhf --prefix "${PWD}/package-install/ZcAILib"

            mkdir -p "${PACKAGE_DIR}/include" "${PACKAGE_DIR}/lib/armhf"
            cp -a package-install/ZcAILib/include/. "${PACKAGE_DIR}/include/"
            cp -a package-install/ZcAILib/lib/libZcAiLib.* "${PACKAGE_DIR}/lib/armhf/"

            file "${PACKAGE_DIR}"/lib/armhf/*
            file -L "${PACKAGE_DIR}"/lib/armhf/libZcAiLib.so | grep -Eq 'ELF 32-bit.*ARM'
            tar -C package -czf "${ARCHIVE_NAME}" ZcAILib

      - name: Upload workflow artifact
        uses: actions/upload-artifact@v4
        with:
          name: ${{ env.ARCHIVE_NAME }}
          path: ${{ env.ARCHIVE_NAME }}

      - name: Publish GitHub release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ inputs.tag }}
          name: ${{ inputs.release_name != '' && inputs.release_name || inputs.tag }}
          prerelease: ${{ inputs.prerelease }}
          generate_release_notes: true
          files: ${{ env.ARCHIVE_NAME }}
