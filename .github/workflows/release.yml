name: SDK release
on:
  workflow_dispatch:
    inputs:
      tag:
        description: Release tag (for example v0.2.0)
        required: true
        type: string
      release_name:
        description: Release title
        default: ''
        type: string
      platform:
        description: Platform
        default: all
        type: choice
        options: [all, linux, windows, macos]
      toolchain:
        description: Windows toolchain (auto builds MSVC and MinGW)
        default: auto
        type: choice
        options: [auto, gcc, msvc, mingw]
      prerelease:
        description: Mark prerelease
        default: false
        type: boolean
permissions:
  contents: read
jobs:
  select:
    runs-on: ubuntu-22.04
    outputs:
      matrix: ${{ steps.select.outputs.matrix }}
    steps:
      - id: select
        shell: python
        env:
          PLATFORM: ${{ inputs.platform }}
          TOOLCHAIN: ${{ inputs.toolchain }}
          TAG: ${{ inputs.tag }}
        run: |
          import json, os, re
          if not re.fullmatch(r'[0-9A-Za-z][0-9A-Za-z._+-]*', os.environ['TAG']):
              raise SystemExit('Invalid tag')
          jobs = [
            dict(platform='linux', toolchain='gcc', os='ubuntu-22.04', arch='linux_gcc_64'),
            dict(platform='macos', toolchain='clang', os='macos-15', arch='clang_64'),
            dict(platform='windows', toolchain='msvc', os='windows-2022', arch='win64_msvc2022_64'),
            dict(platform='windows', toolchain='mingw', os='windows-2022', arch='win64_mingw')]
          jobs = [j for j in jobs if os.environ['PLATFORM'] in ('all', j['platform'])]
          jobs = [j for j in jobs if j['platform'] != 'windows' or os.environ['TOOLCHAIN'] in ('auto', j['toolchain'])]
          if not jobs:
              raise SystemExit('Unsupported platform/toolchain combination')
          with open(os.environ['GITHUB_OUTPUT'], 'a') as output:
              output.write('matrix=' + json.dumps({'include': jobs}) + '\n')
  build:
    needs: select
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix: ${{ fromJSON(needs.select.outputs.matrix) }}
    steps:
      - uses: actions/checkout@v4
      - uses: seanmiddleditch/gha-setup-ninja@v5
      - uses: ilammy/msvc-dev-cmd@v1
        if: matrix.toolchain == 'msvc'
      - uses: msys2/setup-msys2@v2
        if: matrix.toolchain == 'mingw'
        with:
          msystem: MINGW64
          update: true
          install: mingw-w64-x86_64-gcc mingw-w64-x86_64-cmake mingw-w64-x86_64-ninja
      - name: Linux runtime dependencies
        if: matrix.platform == 'linux'
        run: sudo apt-get update && sudo apt-get install -y libgl1-mesa-dev libxkbcommon-dev libxcb-cursor0 libssl-dev
      - uses: jurplel/install-qt-action@v4
        with:
          version: '6.8.3'
          arch: ${{ matrix.arch }}
          cache: true
      - name: Configure, build and test
        if: matrix.toolchain != 'mingw'
        shell: bash
        env:
          PLATFORM: ${{ matrix.platform }}
        run: |
          extra=()
          if [[ "$PLATFORM" == macos ]]; then
            extra=(-DCMAKE_OSX_ARCHITECTURES=arm64 -DCMAKE_OSX_DEPLOYMENT_TARGET=12.0)
          fi
          cmake -S . -B build -G Ninja -DCMAKE_BUILD_TYPE=Release "${extra[@]}"
          cmake --build build --parallel 4
          ctest --test-dir build --output-on-failure
          cmake --install build --prefix "$PWD/package/ZcAILib"
      - name: Configure, build and test MinGW
        if: matrix.toolchain == 'mingw'
        shell: msys2 {0}
        run: |
          cmake -S . -B build -G Ninja -DCMAKE_BUILD_TYPE=Release -DCMAKE_PREFIX_PATH="$(cygpath -u "$QT_ROOT_DIR")"
          cmake --build build --parallel 4
          ctest --test-dir build --output-on-failure
          cmake --install build --prefix "$PWD/package/ZcAILib"
      - name: Archive Windows SDK
        if: matrix.platform == 'windows'
        shell: pwsh
        env:
          TAG: ${{ inputs.tag }}
          TOOLCHAIN: ${{ matrix.toolchain }}
        run: Compress-Archive -Path package/ZcAILib -DestinationPath "ZcAILib-$env:TAG-windows-$env:TOOLCHAIN.zip"
      - name: Archive Unix SDK
        if: matrix.platform != 'windows'
        shell: bash
        env:
          TAG: ${{ inputs.tag }}
          PLATFORM: ${{ matrix.platform }}
          TOOLCHAIN: ${{ matrix.toolchain }}
        run: tar -C package -czf "ZcAILib-$TAG-$PLATFORM-$TOOLCHAIN.tar.gz" ZcAILib
      - uses: actions/upload-artifact@v4
        with:
          name: pkg-${{ matrix.platform }}-${{ matrix.toolchain }}
          path: |
            ZcAILib-*.zip
            ZcAILib-*.tar.gz
          if-no-files-found: error
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: tests-${{ matrix.platform }}-${{ matrix.toolchain }}
          path: |
            build/Testing/Temporary/LastTest.log
            build/tests/*.txt
  release:
    needs: build
    runs-on: ubuntu-22.04
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          pattern: pkg-*
          path: release_assets
          merge-multiple: true
      - uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ inputs.tag }}
          name: ${{ inputs.release_name || inputs.tag }}
          prerelease: ${{ inputs.prerelease }}
          generate_release_notes: true
          fail_on_unmatched_files: true
          files: release_assets/*
